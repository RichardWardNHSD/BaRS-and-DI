              $ref: "#/components/examples/emptyBundle"
            appointmentListWithIncludedLocation:
              $ref: "#/components/examples/appointmentListWithIncludedLocation"
            appointmentSingleWithIncludedActors:
              $ref: "#/components/examples/appointmentSingleWithIncludedActors"
    4XX:
      description: |
        TO-DO - revise.
        When the service is unable to serve a successful response a FHIR `OperationOutcome` resource should be returned with the relevant HTTP status code defined as follows:
        | HTTP status | Error code          | Description                                                         |
        | ----------- | ------------------- | ------------------------------------------------------------------- |
        | 400         | `exception`         | Missing or invalid `_id` search parameter in request                |
        | 401         | `processing`        | Missing or invalid OAuth 2.0 bearer token in request                |
        | 403         | `forbidden`         | Patient is under 16 years of age                                    |
        | 404         | `not-found`         | The requested appointment was not found                             |
        | 429         | `TOO_MANY_REQUESTS` | You have exceeded your application's rate limit.                    |
        For details see the `diagnostics` field.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/xCorrelationId"
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            missingId:
              $ref: "#/components/examples/missingId"
            invalidAuthToken:
              $ref: "#/components/examples/invalidAuthToken"
            under16:
              $ref: "#/components/examples/under16"
            notFound:
              $ref: "#/components/examples/notFound"
            rateLimit:
              $ref: "#/components/examples/rateLimit"
    5XX:
      description: |
        When the service is unable to serve a successful response a FHIR `OperationOutcome` resource should be returned with the relevant HTTP status code defined as follows:
        | HTTP status | Error code          | Description                                                         |
        | ----------- | ------------------- | ------------------------------------------------------------------- |
        | 504         | `exception`         | Gateway Timeout                                                     |
        For details see the `diagnostics` field.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/xCorrelationId"
      content:
        application/fhir+json:
          schema:
            $ref: "#/components/schemas/OperationOutcome"
          examples:
            gatewayTimeout:
              $ref: "#/components/examples/gatewayTimeout"
